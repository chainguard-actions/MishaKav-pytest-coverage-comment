name: Test XML coverage report
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture XML coverage file to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-xml-coverage-path: ./coverage.xml
          hide-comment: 'true'
          title: 'XML Coverage Report'
          badge-title: 'Coverage'
          default-branch: 'main'

      - name: Assert coverage output is set
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected coverage output to be non-empty"
            exit 1
          fi
          echo "PASS: coverage=$ACTUAL"

      - name: Assert color output is set
        env:
          ACTUAL: ${{ steps.action.outputs.color }}
        run: |
          echo "actual color: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected color output to be non-empty"
            exit 1
          fi
          # Valid badge colors
          case "$ACTUAL" in
            red|orange|yellow|green|brightgreen)
              echo "PASS: color is valid badge color: $ACTUAL"
              ;;
            *)
              echo "FAIL: unexpected color value: $ACTUAL"
              exit 1
              ;;
          esac

      - name: Assert coverageHtml output is set
        env:
          ACTUAL: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "actual coverageHtml length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected coverageHtml output to be non-empty"
            exit 1
          fi
          echo "PASS: coverageHtml is non-empty"
