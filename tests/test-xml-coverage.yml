name: Test XML coverage parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create XML coverage report
        run: |
          cat > /tmp/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="6.3.2" timestamp="1648000000" lines-valid="50" lines-covered="42" line-rate="0.84" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="src" line-rate="0.84" branch-rate="0" complexity="0">
                <classes>
                  <class name="calculator.py" filename="src/calculator.py" complexity="0" line-rate="0.80" branch-rate="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="5" hits="1"/>
                      <line number="10" hits="0"/>
                      <line number="11" hits="0"/>
                      <line number="15" hits="1"/>
                    </lines>
                  </class>
                  <class name="utils.py" filename="src/utils.py" complexity="0" line-rate="1.0" branch-rate="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="5" hits="1"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF

      - id: action
        uses: .
        with:
          pytest-xml-coverage-path: /tmp/coverage.xml
          hide-comment: 'true'
          title: 'XML Coverage Report'

      - name: Assert coverage output is set
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage=$COVERAGE color=$COLOR"

      - name: Assert coverageHtml output is set
        env:
          COVERAGE_HTML: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "coverageHtml length: ${#COVERAGE_HTML}"
          if [ -z "$COVERAGE_HTML" ]; then
            echo "FAIL: coverageHtml output is empty"
            exit 1
          fi
          echo "PASS: coverageHtml is populated"
