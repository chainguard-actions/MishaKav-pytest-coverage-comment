name: Test XML coverage report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create XML coverage file
        run: |
          cat > /tmp/coverage.xml << 'EOF'
          <?xml version="1.0" ?>
          <coverage version="6.3.2" timestamp="1648000000" lines-valid="100" lines-covered="78" line-rate="0.78" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <packages>
              <package name="src" line-rate="0.78" branch-rate="0" complexity="0">
                <classes>
                  <class name="__init__.py" filename="src/__init__.py" complexity="0" line-rate="1.0" branch-rate="0">
                    <lines/>
                  </class>
                  <class name="calculator.py" filename="src/calculator.py" complexity="0" line-rate="0.85" branch-rate="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="2" hits="1"/>
                      <line number="10" hits="0"/>
                      <line number="11" hits="0"/>
                      <line number="12" hits="0"/>
                    </lines>
                  </class>
                  <class name="utils.py" filename="src/utils.py" complexity="0" line-rate="0.87" branch-rate="0">
                    <lines>
                      <line number="1" hits="1"/>
                      <line number="25" hits="0"/>
                      <line number="30" hits="0"/>
                    </lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-xml-coverage-path: /tmp/coverage.xml
          hide-comment: 'true'
          title: 'XML Coverage Report'

      - name: Assert coverage output is set
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage=$COVERAGE"

      - name: Assert color output is set
        env:
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "color: $COLOR"
          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi
          echo "PASS: color=$COLOR"
