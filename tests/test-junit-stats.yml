name: Test JUnit XML test statistics parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture files to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pytest-coverage.txt" "$GITHUB_WORKSPACE/pytest-coverage.txt"
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit.xml" "$GITHUB_WORKSPACE/junit.xml"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./junit.xml
          junitxml-title: 'Test Results'
          hide-comment: 'true'

      - name: Assert tests output is set
        env:
          TESTS: ${{ steps.action.outputs.tests }}
        run: |
          echo "tests: $TESTS"
          if [ -z "$TESTS" ]; then
            echo "FAIL: tests output is empty"
            exit 1
          fi
          echo "PASS: tests output is '$TESTS'"

      - name: Assert failures output is set
        env:
          FAILURES: ${{ steps.action.outputs.failures }}
        run: |
          echo "failures: $FAILURES"
          if [ -z "$FAILURES" ]; then
            echo "FAIL: failures output is empty"
            exit 1
          fi
          echo "PASS: failures output is '$FAILURES'"

      - name: Assert skipped output is set
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ -z "$SKIPPED" ]; then
            echo "FAIL: skipped output is empty"
            exit 1
          fi
          echo "PASS: skipped output is '$SKIPPED'"

      - name: Assert time output is set
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time output is '$TIME'"

      - name: Assert summaryReport output is set
        env:
          SUMMARY: ${{ steps.action.outputs.summaryReport }}
        run: |
          echo "summaryReport length: ${#SUMMARY}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: summaryReport output is empty"
            exit 1
          fi
          echo "PASS: summaryReport output is set"
