name: Test JUnit XML statistics and failed tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pytest-coverage-path: tests/fixtures/pytest-coverage.txt
          junitxml-path: tests/fixtures/junit.xml
          junitxml-title: My JUnit Summary
          show-failed-tests: 'true'
      - name: Assert test counts
        env:
          TESTS: ${{ steps.action.outputs.tests }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          FAILURES: ${{ steps.action.outputs.failures }}
          ERRORS: ${{ steps.action.outputs.errors }}
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "tests=$TESTS skipped=$SKIPPED failures=$FAILURES errors=$ERRORS time=$TIME"
          [ "$TESTS" = "4" ] || { echo "FAIL: tests expected 4"; exit 1; }
          [ "$SKIPPED" = "1" ] || { echo "FAIL: skipped expected 1"; exit 1; }
          [ "$FAILURES" = "1" ] || { echo "FAIL: failures expected 1"; exit 1; }
          [ "$ERRORS" = "0" ] || { echo "FAIL: errors expected 0"; exit 1; }
          [ "$TIME" = "1.5" ] || { echo "FAIL: time expected 1.5"; exit 1; }
          echo "PASS"
      - name: Assert notSuccessTestInfo
        env:
          ACTUAL: ${{ steps.action.outputs.notSuccessTestInfo }}
        run: |
          echo "actual: $ACTUAL"
          COUNT=$(printf '%s' "$ACTUAL" | jq -r '.count')
          FAILED=$(printf '%s' "$ACTUAL" | jq -r '.failures[0].name')
          SKIP=$(printf '%s' "$ACTUAL" | jq -r '.skipped[0].name')
          [ "$COUNT" = "2" ] || { echo "FAIL: count expected 2, got $COUNT"; exit 1; }
          [ "$FAILED" = "test_divide_broken" ] || { echo "FAIL: failed test name '$FAILED'"; exit 1; }
          [ "$SKIP" = "test_skip_me" ] || { echo "FAIL: skipped test name '$SKIP'"; exit 1; }
          echo "PASS"
      - name: Assert failedTestsHtml and summaryReport
        env:
          FAILED_HTML: ${{ steps.action.outputs.failedTestsHtml }}
          SUMMARY: ${{ steps.action.outputs.summaryReport }}
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "failedTestsHtml: $FAILED_HTML"
          echo "summaryReport: $SUMMARY"
          if ! printf '%s' "$FAILED_HTML" | grep -qF "test_divide_broken"; then
            echo "FAIL: failedTestsHtml should mention the failing test"
            exit 1
          fi
          if ! printf '%s' "$SUMMARY" | grep -qF "My JUnit Summary"; then
            echo "FAIL: summaryReport missing junit title"
            exit 1
          fi
          [ "$COVERAGE" = "83%" ] || { echo "FAIL: coverage expected 83%, got $COVERAGE"; exit 1; }
          echo "PASS"
