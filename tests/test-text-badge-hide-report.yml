name: Test text-instead-badge with hide-report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pytest-coverage-path: tests/fixtures/pytest-coverage.txt
          text-instead-badge: 'true'
          hide-report: 'true'
          hide-comment: 'true'
      - name: Assert coverageHtml is plain text
        env:
          HTML: ${{ steps.action.outputs.coverageHtml }}
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverageHtml: $HTML"
          [ "$COVERAGE" = "77%" ] || { echo "FAIL: expected coverage 77%"; exit 1; }
          if [ "$HTML" != "77% (17/22)" ]; then
            echo "FAIL: expected '77% (17/22)'"
            exit 1
          fi
          echo "PASS"
