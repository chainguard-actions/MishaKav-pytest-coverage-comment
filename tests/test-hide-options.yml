name: Test hide-badge and hide-report options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pytest coverage text file
        run: |
          cat > /tmp/pytest-coverage.txt << 'EOF'
          ---------- coverage: platform linux, python 3.9.7-final-0 ----------
          Name                      Stmts   Miss  Cover   Missing
          ---------------------------------------------------------
          src/__init__.py               0      0   100%
          src/app.py                   40      4    90%   15, 25, 35, 45
          ---------------------------------------------------------
          TOTAL                        40      4    90%

          ========================= 5 passed in 0.55s =========================
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: /tmp/pytest-coverage.txt
          hide-comment: 'true'
          hide-badge: 'true'
          hide-report: 'true'
          hide-emoji: 'true'
          title: 'Hidden Options Test'

      - name: Assert coverage output is still produced when display options are hidden
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty even with hide options"
            exit 1
          fi
          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty even with hide options"
            exit 1
          fi
          echo "PASS: outputs produced correctly with hide options enabled"

      - name: Assert coverage percentage is in expected range
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          # Coverage should contain a percentage value
          if ! echo "$COVERAGE" | grep -qE '^[0-9]+%$'; then
            echo "FAIL: coverage '$COVERAGE' does not match expected format (e.g. '90%')"
            exit 1
          fi
          echo "PASS: coverage format is valid"
