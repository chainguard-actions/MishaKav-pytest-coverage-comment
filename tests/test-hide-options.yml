name: Test hide-badge and hide-report options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up GITHUB_STEP_SUMMARY
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/step_summary.md"
          touch "$SUMMARY_FILE"
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: tests/fixtures/pytest-coverage.txt
          hide-badge: 'true'
          hide-report: 'true'
          hide-comment: 'true'
          title: 'My Custom Coverage Title'
          badge-title: 'My Coverage Badge'

      - name: Assert coverage output is still populated when badge and report are hidden
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty even with hide-badge and hide-report"
            exit 1
          fi
          echo "PASS: coverage output is '$COVERAGE'"

      - name: Assert color output is still populated when badge and report are hidden
        env:
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "color: $COLOR"
          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty even with hide-badge and hide-report"
            exit 1
          fi
          echo "PASS: color output is '$COLOR'"

      - name: Assert coverage percentage is still 30%
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          if [ "$COVERAGE" != "30%" ]; then
            echo "FAIL: expected coverage to be '30%', got '$COVERAGE'"
            exit 1
          fi
          echo "PASS: coverage is 30%"
