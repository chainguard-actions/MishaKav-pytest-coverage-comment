name: Test multiple-files coverage report
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple coverage text files
        run: |
          # Backend coverage
          cat > /tmp/backend-coverage.txt << 'EOF'
          ---------- coverage: platform linux, python 3.9.7-final-0 ----------
          Name                      Stmts   Miss  Cover   Missing
          ---------------------------------------------------------
          backend/__init__.py           0      0   100%
          backend/api.py               60      6    90%   10, 20, 30, 40, 50, 60
          ---------------------------------------------------------
          TOTAL                        60      6    90%

          ========================= 12 passed in 1.10s =========================
          EOF

          # Frontend coverage
          cat > /tmp/frontend-coverage.txt << 'EOF'
          ---------- coverage: platform linux, python 3.9.7-final-0 ----------
          Name                      Stmts   Miss  Cover   Missing
          ---------------------------------------------------------
          frontend/__init__.py          0      0   100%
          frontend/views.py            40     12    70%   5-10, 20-25, 35-40
          ---------------------------------------------------------
          TOTAL                        40     12    70%

          ========================= 8 passed in 0.80s =========================
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          hide-comment: 'true'
          multiple-files: |
            Backend API, /tmp/backend-coverage.txt
            Frontend Tests, /tmp/frontend-coverage.txt

      - name: Assert coverageHtml output is set for multiple files
        env:
          HTML: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "coverageHtml length: ${#HTML}"
          if [ -z "$HTML" ]; then
            echo "FAIL: coverageHtml output is empty for multiple-files scenario"
            exit 1
          fi
          echo "PASS: coverageHtml is set for multiple-files scenario"
