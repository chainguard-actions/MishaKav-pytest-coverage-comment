name: Test PR comment posting (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage file to expected path
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pytest-coverage.txt" "$GITHUB_WORKSPACE/pytest-coverage.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: ./pytest-coverage.txt
          issue-number: '1'
          title: 'PR Comment Test'
          badge-title: 'Coverage'
          default-branch: 'main'

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COVERAGE" ]; then
              echo "FAIL: action succeeded but coverage output is empty"
              exit 1
            fi
            echo "PASS: got coverage='$COVERAGE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
