name: Test PR comment creation (sentinel repo graceful handling)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pytest coverage text file
        run: |
          cat > /tmp/pytest-coverage.txt << 'EOF'
          ---------- coverage: platform linux, python 3.9.7-final-0 ----------
          Name                      Stmts   Miss  Cover   Missing
          ---------------------------------------------------------
          src/main.py                  25      2    92%   30-31
          ---------------------------------------------------------
          TOTAL                        25      2    92%

          ========================= 6 passed in 0.28s =========================
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: /tmp/pytest-coverage.txt
          issue-number: '1'

      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COVERAGE" ]; then
              echo "FAIL: action succeeded but coverage output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with coverage=$COVERAGE color=$COLOR"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no real PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
