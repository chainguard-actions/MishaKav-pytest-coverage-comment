name: Test custom options (hide-badge, hide-report, custom title)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pytest coverage text file
        run: |
          cat > /tmp/pytest-coverage.txt << 'EOF'
          ----------- coverage: platform linux, python 3.9.7-final-0 -----------
          Name                 Stmts   Miss  Cover   Missing
          ----------------------------------------------------
          src/app.py              40      4    90%   10-14
          src/helpers.py          20      0   100%
          ----------------------------------------------------
          TOTAL                   60      4    93%

          =============================== 8 passed in 0.75s ===============================
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: /tmp/pytest-coverage.txt
          title: 'My Custom Coverage Report'
          badge-title: 'My Coverage'
          hide-badge: 'true'
          hide-report: 'false'
          hide-comment: 'true'
          hide-emoji: 'true'
          default-branch: 'main'

      - name: Assert coverage output is set
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "coverage: $COVERAGE"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage=$COVERAGE"

      - name: Assert color output is valid
        env:
          COLOR: ${{ steps.action.outputs.color }}
        run: |
          echo "color: $COLOR"
          case "$COLOR" in
            red|orange|yellow|green|brightgreen)
              echo "PASS: color '$COLOR' is valid"
              ;;
            *)
              echo "FAIL: unexpected color '$COLOR'"
              exit 1
              ;;
          esac

      - name: Assert coverageHtml output is set
        env:
          COVERAGE_HTML: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "coverageHtml length: ${#COVERAGE_HTML}"
          if [ -z "$COVERAGE_HTML" ]; then
            echo "FAIL: coverageHtml output is empty"
            exit 1
          fi
          echo "PASS: coverageHtml is set"
