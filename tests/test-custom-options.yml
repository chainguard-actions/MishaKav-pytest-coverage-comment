name: Test custom options (hide-badge, hide-report, custom title)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create pytest coverage text file
        run: |
          cat > /tmp/pytest-coverage.txt << 'EOF'
          ---------- coverage: platform linux, python 3.9.7-final-0 ----------
          Name                      Stmts   Miss  Cover   Missing
          ---------------------------------------------------------
          src/app.py                   50      5    90%   20-24
          src/models.py                30      0   100%
          ---------------------------------------------------------
          TOTAL                        80      5    94%

          ========================= 10 passed in 0.55s =========================
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: /tmp/pytest-coverage.txt
          title: 'My Custom Coverage Report'
          badge-title: 'Test Coverage'
          hide-badge: 'false'
          hide-report: 'false'
          hide-comment: 'true'
          hide-emoji: 'true'
          default-branch: 'main'

      - name: Assert coverage output with custom options
        env:
          COVERAGE: ${{ steps.action.outputs.coverage }}
          COLOR: ${{ steps.action.outputs.color }}
          HTML: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "coverage: $COVERAGE"
          echo "color: $COLOR"
          echo "coverageHtml length: ${#HTML}"
          if [ -z "$COVERAGE" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          if [ -z "$COLOR" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi
          if [ -z "$HTML" ]; then
            echo "FAIL: coverageHtml output is empty"
            exit 1
          fi
          echo "PASS: all outputs present with custom options"
