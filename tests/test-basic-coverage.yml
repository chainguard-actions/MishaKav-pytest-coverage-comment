name: Test basic coverage txt parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage file to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/pytest-coverage.txt" "$GITHUB_WORKSPACE/pytest-coverage.txt"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: ./pytest-coverage.txt
          hide-comment: 'true'
          title: 'Coverage Report'
          default-branch: 'main'

      - name: Assert coverage output is set
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage output is empty"
            exit 1
          fi
          echo "PASS: coverage output is '$ACTUAL'"

      - name: Assert color output is set
        env:
          ACTUAL: ${{ steps.action.outputs.color }}
        run: |
          echo "actual color: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: color output is empty"
            exit 1
          fi
          echo "PASS: color output is '$ACTUAL'"

      - name: Assert coverage is 30%
        env:
          ACTUAL: ${{ steps.action.outputs.coverage }}
        run: |
          echo "actual coverage: $ACTUAL"
          if [ "$ACTUAL" != "30%" ]; then
            echo "FAIL: expected '30%' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert color is red (low coverage)
        env:
          ACTUAL: ${{ steps.action.outputs.color }}
        run: |
          echo "actual color: $ACTUAL"
          if [ "$ACTUAL" != "red" ]; then
            echo "FAIL: expected 'red' for 30% coverage but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert coverageHtml output is set
        env:
          ACTUAL: ${{ steps.action.outputs.coverageHtml }}
        run: |
          echo "actual coverageHtml length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverageHtml output is empty"
            exit 1
          fi
          echo "PASS: coverageHtml is populated"
