name: Test JUnit XML test statistics
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up GITHUB_STEP_SUMMARY
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/step_summary.md"
          touch "$SUMMARY_FILE"
          echo "GITHUB_STEP_SUMMARY=$SUMMARY_FILE" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: tests/fixtures/pytest-coverage.txt
          junitxml-path: tests/fixtures/junit.xml
          junitxml-title: 'Test Results'
          hide-comment: 'true'

      - name: Assert tests output is set
        env:
          TESTS: ${{ steps.action.outputs.tests }}
        run: |
          echo "tests: $TESTS"
          if [ -z "$TESTS" ]; then
            echo "FAIL: tests output is empty"
            exit 1
          fi
          echo "PASS: tests output is '$TESTS'"

      - name: Assert tests count is 10
        env:
          TESTS: ${{ steps.action.outputs.tests }}
        run: |
          echo "tests: $TESTS"
          if [ "$TESTS" != "10" ]; then
            echo "FAIL: expected tests to be '10', got '$TESTS'"
            exit 1
          fi
          echo "PASS: tests count is 10"

      - name: Assert skipped count is 2
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "skipped: $SKIPPED"
          if [ "$SKIPPED" != "2" ]; then
            echo "FAIL: expected skipped to be '2', got '$SKIPPED'"
            exit 1
          fi
          echo "PASS: skipped count is 2"

      - name: Assert failures count is 1
        env:
          FAILURES: ${{ steps.action.outputs.failures }}
        run: |
          echo "failures: $FAILURES"
          if [ "$FAILURES" != "1" ]; then
            echo "FAIL: expected failures to be '1', got '$FAILURES'"
            exit 1
          fi
          echo "PASS: failures count is 1"

      - name: Assert errors count is 0
        env:
          ERRORS: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors: $ERRORS"
          if [ "$ERRORS" != "0" ]; then
            echo "FAIL: expected errors to be '0', got '$ERRORS'"
            exit 1
          fi
          echo "PASS: errors count is 0"

      - name: Assert time output is set
        env:
          TIME: ${{ steps.action.outputs.time }}
        run: |
          echo "time: $TIME"
          if [ -z "$TIME" ]; then
            echo "FAIL: time output is empty"
            exit 1
          fi
          echo "PASS: time output is '$TIME'"

      - name: Assert summaryReport output is set
        env:
          SUMMARY: ${{ steps.action.outputs.summaryReport }}
        run: |
          echo "summaryReport length: ${#SUMMARY}"
          if [ -z "$SUMMARY" ]; then
            echo "FAIL: summaryReport output is empty"
            exit 1
          fi
          echo "PASS: summaryReport is non-empty"
