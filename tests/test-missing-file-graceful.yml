name: Test graceful handling of missing coverage file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          pytest-coverage-path: ./nonexistent-coverage.txt
          hide-comment: 'true'

      - name: Assert action ran (either succeeded with empty output or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COVERAGE: ${{ steps.action.outputs.coverage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coverage: $COVERAGE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (possibly with empty coverage)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on missing file"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
